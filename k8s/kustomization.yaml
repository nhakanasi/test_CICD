apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: llm
resources:
- namespace.yaml
- ollama.yaml
- chat-ui.yaml
# The model to serve. Kustomize appends a content hash to the ConfigMap
# name, so changing MODEL changes the Deployment and triggers a rollout.
configMapGenerator:
- literals:
  - MODEL=qwen2.5:0.5b
  name: llm-config
# CI rewrites the chat-ui tag on every push that changes app/.
images:
- name: chat-ui
  newName: ghcr.io/nhakanasi/test_cicd
  newTag: 6942daf368221570f64e809ed14ebd6228c2ee97
- name: ollama
  newName: ollama/ollama
  newTag: 0.40.15
