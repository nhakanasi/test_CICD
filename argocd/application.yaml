apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: llm-host
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/nhakanasi/test_CICD.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: llm
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
