server {
    listen 80;
    root /usr/share/nginx/html;

    location / {
        try_files $uri /index.html;
    }

    # Forward the Ollama API (/api/*) and its OpenAI-compatible API (/v1/*)
    # to the in-cluster Service "ollama".
    location ~ ^/(api|v1)/ {
        proxy_pass http://ollama:11434;
        proxy_http_version 1.1;
        proxy_set_header Origin "";
        # LLM responses stream token by token and can run for minutes:
        # disable buffering so tokens reach the browser immediately,
        # and raise timeouts above nginx's 60s default.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }
}
