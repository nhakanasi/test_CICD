<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LLM Chat</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #0f172a; color: #e2e8f0; }
    main { max-width: 760px; margin: 0 auto; padding: 24px 16px; }
    h1 { color: #38bdf8; font-size: 1.4rem; }
    #log { white-space: pre-wrap; background: #1e293b; border-radius: 8px; padding: 16px; min-height: 240px; margin-top: 12px; }
    .user { color: #38bdf8; margin-top: 8px; }
    form { display: flex; gap: 8px; margin-top: 12px; }
    input, select, button { font: inherit; padding: 8px; border-radius: 6px; border: 1px solid #334155; background: #0b1220; color: inherit; }
    input { flex: 1; min-width: 0; }
    button { background: #0284c7; border: 0; cursor: pointer; }
    button:disabled { opacity: 0.5; cursor: wait; }
    #stats { color: #94a3b8; font-size: 0.85rem; margin-top: 8px; }
  </style>
</head>
<body>
<main>
  <h1>LLM on Kubernetes + Argo CD</h1>
  <label>Model <select id="model"></select></label>
  <div id="log"></div>
  <form id="form">
    <input id="prompt" placeholder="Ask something..." autocomplete="off" required>
    <button id="send">Send</button>
  </form>
  <div id="stats"></div>
</main>
<script>
const log = document.getElementById('log');
const stats = document.getElementById('stats');
const modelSelect = document.getElementById('model');
const sendButton = document.getElementById('send');
const messages = [];

async function loadModels() {
  try {
    const res = await fetch('/api/tags');
    if (!res.ok) throw new Error(res.status);
    const { models } = await res.json();
    modelSelect.replaceChildren(...models.map(m => new Option(m.name)));
    stats.textContent = models.length ? '' : 'No model downloaded yet.';
  } catch {
    stats.textContent = 'Ollama not reachable yet (model still loading?). Retrying...';
    setTimeout(loadModels, 5000);
  }
}

function addLine(className, text) {
  const div = document.createElement('div');
  div.className = className;
  div.textContent = text;
  log.appendChild(div);
  return div;
}

async function chat(text) {
  messages.push({ role: 'user', content: text });
  addLine('user', '> ' + text);
  const out = addLine('', '...');

  const start = performance.now();
  let firstToken = null;
  let reply = '';
  const res = await fetch('/api/chat', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ model: modelSelect.value, messages, stream: true }),
  });
  if (!res.ok) {
    out.textContent = 'Error ' + res.status + ': ' + await res.text();
    messages.pop();
    return;
  }

  // Ollama streams one JSON object per line (NDJSON).
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();
    for (const line of lines) {
      if (!line) continue;
      const chunk = JSON.parse(line);
      if (chunk.message && chunk.message.content) {
        if (firstToken === null) firstToken = performance.now();
        reply += chunk.message.content;
        out.textContent = reply;
      }
      if (chunk.done) {
        const tokensPerSecond = chunk.eval_count / (chunk.eval_duration / 1e9);
        stats.textContent =
          'time to first token ' + ((firstToken - start) / 1000).toFixed(2) + 's · ' +
          tokensPerSecond.toFixed(1) + ' tokens/s · ' + chunk.eval_count + ' tokens';
      }
    }
  }
  messages.push({ role: 'assistant', content: reply });
}

document.getElementById('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const input = document.getElementById('prompt');
  const text = input.value;
  input.value = '';
  sendButton.disabled = true;
  try {
    await chat(text);
  } catch (err) {
    addLine('', 'Error: ' + err.message);
  } finally {
    sendButton.disabled = false;
  }
});

loadModels();
</script>
</body>
</html>
